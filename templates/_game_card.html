<article class="game-card">
  <a
    class="game-thumb game-play-link"
    href="{{ url_for('games.play', game_slug=game.slug) }}"
    aria-label="Play {{ game.title }} online"
  >
    <img
      src="{{ game.thumbnail_url or url_for('static',filename='images/arcadex-logo.png') }}"
      alt="{{ game.title }} - Play online game"
      loading="lazy"
      onerror="this.onerror=null;this.src='{{ url_for('static',filename='images/arcadex-logo.png') }}';"
    >

    <span class="difficulty">{{ game.difficulty }}</span>
    <span class="thumb-play">Play</span>
  </a>

  <div class="game-card-body">

    <div class="game-meta">
      <span>
        <a
          href="{{ url_for('games.category_games', category_slug=game.category_slug) }}"
          aria-label="Browse {{ game.category_name }} games"
        >
          {{ game.category_name }}
        </a>
      </span>

      <span>{{ game.play_count }} plays</span>
    </div>

    <h3>
      <a
        href="{{ url_for('games.play', game_slug=game.slug) }}"
        class="game-title-link"
      >
        {{ game.title }}
      </a>
    </h3>

    <p>{{ game.description or 'Jump in and start playing.' }}</p>

    <div class="card-actions">
      <a
        class="btn primary small game-play-link"
        href="{{ url_for('games.play',game_slug=game.slug) }}"
        aria-label="Play {{ game.title }} online"
      >
        Play Game
      </a>

      <button
        type="button"
        class="icon-btn favorite-toggle"
        data-game-id="{{ game.id }}"
        aria-label="Toggle {{ game.title }} favorite"
      >
        ♡
      </button>
    </div>

  </div>
</article>
