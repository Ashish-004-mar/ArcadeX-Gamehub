{% extends 'base.html' %}{% set title='GameHub | Add Game' %}{% block content %}<section class="admin-layout"><aside class="admin-sidebar"><b>GameHub Admin</b><a href="{{ url_for('admin.admin_dashboard') }}">Overview</a><a class="active" href="{{ url_for('admin.admin_games') }}">Games</a><a href="{{ url_for('admin.admin_categories') }}">Categories</a><a href="{{ url_for('admin.admin_home') }}">Home Customization</a><a href="{{ url_for('admin.admin_announcements') }}">Announcements</a></aside><div class="admin-content"><span class="eyebrow">MYSQL CREATE</span><h1>Add Game</h1><form class="form-grid panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Game Title<input name="title" required></label><label>Category<select name="category_id" required><option value="">Select</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label class="full">Description<textarea name="description"></textarea></label><label>Thumbnail Image URL<input name="thumbnail_url"></label><label>Embed Game URL<input name="embed_url" required placeholder="https://provider.example/embed/game"></label><label>Difficulty<select name="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label>Tags<input name="tags" placeholder="racing,cars,speed"></label><label>Status<select name="status"><option>active</option><option>inactive</option></select></label><div class="full form-actions"><button class="btn primary">Save Game</button><a class="btn" href="{{ url_for('admin.admin_games') }}">Cancel</a></div></form></div></section>{% endblock %}
