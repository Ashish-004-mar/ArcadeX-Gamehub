{% extends 'base.html' %}{% set title='GameHub | Games' %}{% block content %}<section class="section"><div class="section-head"><div><span class="eyebrow">GAME LIBRARY</span><h1>Explore games</h1></div><form class="filterbar"><input name="q" value="{{ request.args.get('q','') }}" placeholder="Search title or tag"><select name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.slug }}" {% if request.args.get('category')==c.slug %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select><select name="difficulty"><option value="">All difficulty</option>{% for d in ['Easy','Medium','Hard'] %}<option value="{{ d }}" {% if request.args.get('difficulty')==d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select><select name="sort"><option value="newest">Newest</option><option value="popular" {% if request.args.get('sort')=='popular' %}selected{% endif %}>Popular</option><option value="category" {% if request.args.get('sort')=='category' %}selected{% endif %}>Category</option><option value="oldest" {% if request.args.get('sort')=='oldest' %}selected{% endif %}>Oldest</option></select><button class="btn primary">Search</button></form></div><div class="game-grid">{% for game in games %}{% include '_game_card.html' %}{% else %}<p class="empty-state">No games found.</p>{% endfor %}</div></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='js/games.js') }}"></script>{% endblock %}
