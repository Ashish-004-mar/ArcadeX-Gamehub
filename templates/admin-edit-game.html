{% extends 'base.html' %}{% set title='GameHub | Edit Game' %}{% block content %}<section class="admin-layout"><aside class="admin-sidebar"><b>GameHub Admin</b><a href="{{ url_for('admin.admin_dashboard') }}">Overview</a><a class="active" href="{{ url_for('admin.admin_games') }}">Games</a><a href="{{ url_for('admin.admin_categories') }}">Categories</a><a href="{{ url_for('admin.admin_home') }}">Home Customization</a><a href="{{ url_for('admin.admin_announcements') }}">Announcements</a></aside><div class="admin-content"><span class="eyebrow">MYSQL UPDATE</span><h1>Edit Game</h1><form class="form-grid panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Game Title<input name="title" value="{{ game.title }}" required></label><label>Category<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if game.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label class="full">Description<textarea name="description">{{ game.description or '' }}</textarea></label><label>Thumbnail Image URL<input name="thumbnail_url" value="{{ game.thumbnail_url or '' }}"></label><label>Embed Game URL<input name="embed_url" value="{{ game.embed_url }}" required></label><label>Difficulty<select name="difficulty">{% for d in ['Easy','Medium','Hard'] %}<option {% if game.difficulty==d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></label><label>Tags<input name="tags" value="{{ game.tags or '' }}"></label><label>Status<select name="status"><option value="active" {% if game.status=='active' %}selected{% endif %}>active</option><option value="inactive" {% if game.status=='inactive' %}selected{% endif %}>inactive</option></select></label><div class="full form-actions"><button class="btn primary">Update Game</button><a class="btn" href="{{ url_for('admin.admin_games') }}">Cancel</a></div></form></div></section>{% endblock %}
