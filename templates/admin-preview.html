{% extends 'base.html' %}{% set title='GameHub | Preview' %}{% block content %}<section class="play-page"><div class="play-head"><div><span class="eyebrow">ADMIN PREVIEW · {{ game.category_name }}</span><h1>{{ game.title }}</h1><p class="muted">Status: {{ game.status }}</p></div><a class="btn" href="{{ url_for('admin.edit_game',game_id=game.id) }}">Edit</a></div><div class="iframe-shell"><iframe src="{{ game.embed_url }}" title="Preview {{ game.title }}" allowfullscreen></iframe></div></section>{% endblock %}
